version: "2"
linters:
  default: none
  enable:
    - errorlint
    - ineffassign
    - revive
    - staticcheck
    - modernize
  settings:
    errorlint:
      errorf: true
      asserts: false
      comparison: false
    staticcheck:
      checks:
        - all
        - -SA1019
        - -ST1003
        - -SA5011
        - -QF*
  exclusions:
    presets:
      - comments
    rules:
      - linters:
          - revive
        text: don't use underscores
      - linters:
          - revive
        text: don't use ALL_CAPS
      - linters:
          - revive
        text: avoid meaningless package names
      - linters:
          - revive
        text: stutter
      - linters:
          - revive
        text: unexported-return
      - linters:
          - revive
        text: unused-parameter
      - linters:
          - revive
        text: superfluous-else
      - linters:
          - revive
        text: empty-block
      - linters:
          - modernize
        text: 'unsafefuncs:'
      - linters:
          - modernize
        text: 'stringscut:'
      # Go 1.27 lets a promoted field be set in the outer composite literal.
      # 223 sites, so adopt it as its own change rather than with a bump.
      - linters:
          - modernize
        text: 'embedlit:'
      # pkg/curl/schemes.go explains this one: errors.AsType has to wait for
      # the OSS-Fuzz builder image CIFuzz uses to update its Go toolchain.
      - linters:
          - modernize
        text: 'errorsastype:'
    paths:
      - pkg/uroot/test
